<div layout:fragment="content">
  <div class="container-conteudo">
    <div class="page-header">
      <div class="page-header-left">
        <div class="page-title">Retirada de Reserva</div>
        <div class="page-subtitle">Confirme a entrega do brinde ao funcionário</div>
      </div>
      <a href="/almoxarifado/reservas" class="btn btn-ghost btn-sm">← Ver reservas</a>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">
          <span style="background:var(--accent);color:#0a0a0a;font-family:'Space Mono',monospace;font-size:0.65rem;padding:3px 8px;border-radius:3px;margin-right:10px;">1</span>
          Identificar Funcionário
        </span>
      </div>
      <div class="panel-body">
        <form action="#" method="get" id="formBuscaUsuario">
          <div class="form-grid" style="gap:14px;">
            <div class="form-group">
              <label class="form-label" for="id-func">ID do Funcionário *</label>
              <input type="text" class="form-input" id="id-func" name="np" placeholder="Ex: 00047" required>
              <span class="form-hint">Informe o número de registro do funcionário.</span>
            </div>
            <div class="form-group" style="justify-content: center;">
              <button type="submit" class="btn btn-primary">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Buscar Reservas
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="panel"id="painelUsuario" style="border: none"></div>

    <div class="panel" id="painelConfirmacao" style="border: none"></div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Histórico de Retiradas Recentes</span>
        <span class="page-badge">Maio 2026</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data Retirada</th>
              <th>Nº Reserva</th>
              <th>ID Func.</th>
              <th>Funcionário</th>
              <th>Produto</th>
              <th>Almoxarife</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="reserva : ${listaReservas}">
              <td style="font-family:'Space Mono',monospace;font-size:0.8rem;" th:text="${reserva.dataReserva.toLocalDate()}"></td>
              <td style="font-family:'Space Mono',monospace;font-size:0.75rem;color:var(--muted2);" th:text="${reserva.id}"></td>
              <td style="font-family:'Space Mono',monospace;font-size:0.8rem;" th:text="${reserva.funcionario.np}"></td>
              <td th:text="${reserva.funcionario.nome}"></td>
              <td th:text="${reserva.produto.nome}"></td>
              <td style="color:var(--muted2);">João Ferreira</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="../js/retirada.js"></script>
</div>
