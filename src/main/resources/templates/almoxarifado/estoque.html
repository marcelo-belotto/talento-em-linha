<div layout:fragment="content">
  <div class="container-conteudo">
    <div class="page-header">
      <div class="page-header-left">
        <div class="page-title">Entrada de Estoque</div>
        <div class="page-subtitle">Adicione unidades a produtos já cadastrados</div>
      </div>
      <a href="/almoxarifado/index" class="btn btn-ghost btn-sm">← Voltar ao painel</a>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Registrar Entrada</span>
      </div>
      <div class="panel-body">
        <form action="#" method="get" id="formAdicionarEstoque">
          <div class="form-grid" style="gap:18px;">
            <div class="form-group">
              <label class="form-label" for="produto-sel">Produto *</label>
              <select class="form-select" id="produto-sel" name="idProduto" required >
                <option value="0">— Selecione o produto —</option>
                <option th:each="estoque : ${listaEstoque}" th:value="${estoque.id}" th:text="${#numbers.formatInteger(estoque.id,4)} + ' - ' +${estoque.produto.nome}"></option>

              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="qtd-entrada">Quantidade a Adicionar *</label>
              <input type="number" class="form-input" id="qtd-entrada" name="quantidade" min="1" placeholder="Ex: 20" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="data-entrada">Data da Entrada</label>
              <input type="date" class="form-input" id="data-entrada" name="data">
            </div>
            <div class="form-group span-2">
              <label class="form-label" for="obs-entrada">Observações</label>
              <textarea class="form-textarea" id="obs-entrada" name="observacao" placeholder="Nota fiscal, fornecedor, lote..." style="min-height:70px;"></textarea>
            </div>
          </div>
          <div class="divider" style="margin-top:24px;"></div>
          <div class="form-actions" style="margin-top:20px;">
            <button type="submit" class="btn btn-success">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <polyline points="19 12 12 19 5 12"/>
              </svg>
              Confirmar Entrada
            </button>
            <button type="reset" class="btn btn-ghost">Limpar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Histórico de Entradas</span>
        <span class="page-badge">Maio 2026</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Qtd. Adicionada</th>
              <th>Observações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="movimentacao : ${listaMovimentacao}">
              <td><span style="font-family:'Space Mono',monospace;font-size:0.8rem;" th:text="${movimentacao.dataHora.toLocalDate()}"></span></td>
              <td th:text="${movimentacao.produto.nome}"></td>
              <td><span style="font-family:'Space Mono',monospace;color:var(--accent2);" th:text="'+' + ${movimentacao.quantidade}"></span></td>
              <td style="color:var(--muted2);font-size:0.8rem;" th:text="${movimentacao.observacao}"></td>
            </tr>
